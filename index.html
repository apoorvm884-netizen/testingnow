<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support AI Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 16px;
      border: none;
      background: #111;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .box {
      background: white;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      margin-bottom: 20px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Support AI Assistant</h1>

  <textarea id="question" placeholder="Type your question here... Example: customer is facing KYC issue"></textarea>
  <button onclick="askAI()">Ask AI</button>

  <div class="box" id="status">Status: Waiting...</div>
  <div class="box" id="answer">Answer will appear here...</div>

  <script>
    function normalizeText(text) {
      return String(text || "").toLowerCase().replace(/[^\w\s]/g, " ");
    }

    function getWords(text) {
      return normalizeText(text).split(/\s+/).filter(word => word.length > 2);
    }

    function scoreText(text, questionWords) {
      const lowerText = normalizeText(text);
      let score = 0;

      questionWords.forEach(word => {
        if (lowerText.includes(word)) score += 2;
      });

      if (lowerText.includes("kyc") && questionWords.includes("kyc")) score += 5;
      if (lowerText.includes("cams") && questionWords.includes("cams")) score += 5;
      if (lowerText.includes("kfin") && questionWords.includes("kfin")) score += 5;
      if (lowerText.includes("portfolio") && questionWords.includes("portfolio")) score += 5;
      if (lowerText.includes("escalation") && questionWords.includes("escalation")) score += 3;

      return score;
    }

    function getBestContext(sheetData, docText, question) {
      const questionWords = getWords(question);

      const sheetMatches = sheetData
        .map(item => {
          const text = `
Category: ${item.Category || ""}
Type: ${item.Type || ""}
Sub Type: ${item["Sub Type"] || ""}
Pre-checks: ${item["Pre-checks"] || ""}
Escalation Path: ${item["Escalation Path"] || ""}
          `.trim();

          return {
            text,
            score: scoreText(text, questionWords)
          };
        })
        .filter(item => item.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 2)
        .map(item => item.text);

      const docSections = docText
        .split(/\n\s*\n/)
        .map(x => x.trim())
        .filter(Boolean);

      const docMatches = docSections
        .map(section => ({
          text: section,
          score: scoreText(section, questionWords)
        }))
        .filter(item => item.score > 0)
        .sort((a, b) => b.score - a.score)
        .slice(0, 2)
        .map(item => item.text);

      return `
Top sheet matches:
${sheetMatches.join("\n\n")}

Top doc matches:
${docMatches.join("\n\n")}
      `.trim();
    }

    async function askAI() {
      const question = document.getElementById("question").value.trim();
      const statusBox = document.getElementById("status");
      const answerBox = document.getElementById("answer");

      if (!question) {
        answerBox.textContent = "Please type a question first.";
        return;
      }

      statusBox.textContent = "Loading support data...";
      answerBox.textContent = "";

      try {
        const dataRes = await fetch("https://script.google.com/macros/s/AKfycbzXO8jiY2fo4WEpXG53jcm4pNWYTtZCrnBPgQx--TVzYETdmthEsuuaVpMIZq6wHP1Z/exec");
        const supportData = await dataRes.json();

        const context = getBestContext(
          supportData.sheetData || [],
          supportData.docText || "",
          question
        );

        statusBox.textContent = "Asking AI...";

        const aiRes = await fetch("/api/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question,
            context
          })
        });

        const aiData = await aiRes.json();

        statusBox.textContent = aiData.cached ? "Done (cached)." : "Done.";
        answerBox.textContent = aiData.answer || aiData.error || "No response.";
      } catch (error) {
        statusBox.textContent = "Error.";
        answerBox.textContent = error.message;
      }
    }
  </script>
</body>
</html>
