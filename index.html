<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support AI Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      max-width: 900px;
      margin: auto;
    }
    h1 {
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
      font-size: 16px;
    }
    button {
      padding: 10px 16px;
      border: none;
      background: #111;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .box {
      background: white;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      margin-bottom: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Support AI Assistant</h1>

  <textarea id="question" placeholder="Type your question here... Example: customer is facing KYC issue"></textarea>
  <button onclick="askAI()">Ask AI</button>

  <div class="box" id="status">Status: Waiting...</div>
  <div class="box" id="answer">Answer will appear here...</div>

  <script>
    function scoreText(text, questionWords) {
      const lowerText = text.toLowerCase();
      let score = 0;
      questionWords.forEach(word => {
        if (word && lowerText.includes(word)) score++;
      });
      return score;
    }

    function getBestContext(sheetData, docText, question) {
      const questionWords = question.toLowerCase().split(/\s+/).filter(Boolean);

      const sheetMatches = sheetData
        .map(item => ({
          text: JSON.stringify(item),
          score: scoreText(JSON.stringify(item), questionWords)
        }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 3)
        .map(item => item.text);

      const docSections = docText.split(/\n\s*\n/).filter(Boolean);

      const docMatches = docSections
        .map(section => ({
          text: section,
          score: scoreText(section, questionWords)
        }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 5)
        .map(item => item.text);

      return `
SHEET MATCHES:
${sheetMatches.join("\n\n")}

DOC MATCHES:
${docMatches.join("\n\n")}
`;
    }

    async function askAI() {
      const question = document.getElementById("question").value.trim();
      const statusBox = document.getElementById("status");
      const answerBox = document.getElementById("answer");

      if (!question) {
        answerBox.textContent = "Please type a question first.";
        return;
      }

      statusBox.textContent = "Loading support data...";
      answerBox.textContent = "";

      try {
        const dataRes = await fetch("https://script.google.com/macros/s/AKfycbzXO8jiY2fo4WEpXG53jcm4pNWYTtZCrnBPgQx--TVzYETdmthEsuuaVpMIZq6wHP1Z/exec");
        const supportData = await dataRes.json();

        const context = getBestContext(
          supportData.sheetData || [],
          supportData.docText || "",
          question
        );

        statusBox.textContent = "Asking AI with filtered context...";

        const aiRes = await fetch("/api/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question,
            context
          })
        });

        const aiData = await aiRes.json();

        statusBox.textContent = "Done.";
        answerBox.textContent = aiData.answer || aiData.error || "No response.";
      } catch (error) {
        statusBox.textContent = "Error.";
        answerBox.textContent = error.message;
      }
    }
  </script>
</body>
</html>
