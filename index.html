<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Manual Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      margin-bottom: 20px;
    }
    button {
      padding: 10px 16px;
      border: none;
      background: #111;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    pre {
      background: white;
      padding: 16px;
      border-radius: 10px;
      overflow: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <h1>Support Manual Test</h1>
  <button onclick="loadData()">Load Sheet Data</button>
  <pre id="output">Click the button to load data...</pre>

  <script>
    async function loadData() {
      const output = document.getElementById("output");
      output.textContent = "Loading...";

      try {
        const res = await fetch("https://script.google.com/macros/s/AKfycbxeghc1dOMxuc1KSVIcWnIOA56Qd_TLACBKgomurRxr21H5R9-GSZllkd1p6H9NPr0c/exec");
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        output.textContent = "Error: " + error.message;
      }
    }
  </script>
</body>
</html>
